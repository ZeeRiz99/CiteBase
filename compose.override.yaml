# Development overrides, loaded automatically by `docker compose up`.
# For a production-like run:  docker compose -f compose.yaml up --build
#
# The repo lives on the Windows drive, so file-change events do not reach the containers;
# watchers use polling instead.

x-dev-backend: &dev-backend
  build: { context: ./backend, target: dev }
  volumes:
    - ./backend:/app
  environment:
    ENVIRONMENT: development
    COOKIE_SECURE: "false"
    DATABASE_URL: postgresql+psycopg://citebase_app:${CITEBASE_APP_PASSWORD}@postgres:5432/citebase
    MIGRATIONS_DATABASE_URL: postgresql+psycopg://citebase_owner:${CITEBASE_OWNER_PASSWORD}@postgres:5432/citebase
    TEST_DATABASE_URL: postgresql+psycopg://citebase_app:${CITEBASE_APP_PASSWORD}@postgres:5432/citebase_test
    TEST_MIGRATIONS_DATABASE_URL: postgresql+psycopg://citebase_owner:${CITEBASE_OWNER_PASSWORD}@postgres:5432/citebase_test
    SECRET_KEY: ${SECRET_KEY}
    PRODUCT_NAME: ${PRODUCT_NAME:-CiteBase}
    APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    WATCHFILES_FORCE_POLLING: "true"
    # The bind-mounted repo is not writable by the container user; keep tool caches in /tmp.
    RUFF_CACHE_DIR: /tmp/ruff-cache
    MYPY_CACHE_DIR: /tmp/mypy-cache

# Dev images get their own names, so a production build (`-f compose.yaml build`) can never
# replace the image a dev container runs (they share no tags).
services:
  migrate:
    <<: *dev-backend
    image: citebase-backend:dev

  api:
    <<: *dev-backend
    image: citebase-backend:dev
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --reload
      - --reload-dir=app

  worker:
    <<: *dev-backend
    image: citebase-backend:dev
    command: ["watchfiles", "--filter", "python", "python -m app.worker", "app"]

  web:
    image: citebase-web:dev
    build: { context: ./frontend, target: dev }
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_PRODUCT_NAME: ${PRODUCT_NAME:-CiteBase}
      NEXT_PUBLIC_PRODUCT_TAGLINE: ${PRODUCT_TAGLINE:-Ask your documents. Get answers you can verify.}
      NEXT_PUBLIC_SITE_URL: ${APP_BASE_URL:-http://localhost:8080}
    mem_limit: 1536m

volumes:
  web_node_modules:
  web_next:
