name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      CITEBASE_OWNER_PASSWORD: ci-owner-password
      CITEBASE_APP_PASSWORD: ci-app-password
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://citebase_owner:ci-owner-password@localhost:5432/citebase
      TEST_DATABASE_URL: postgresql+psycopg://citebase_app:ci-app-password@localhost:5432/citebase_test
      TEST_MIGRATIONS_DATABASE_URL: postgresql+psycopg://citebase_owner:ci-owner-password@localhost:5432/citebase_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Create roles, databases and extensions
        run: bash ../infra/postgres/init/01-roles-and-databases.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install text recognition (Tesseract)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install uv and dependencies
        run: |
          pip install uv==0.13.6
          uv sync --frozen

      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Migrations match models
        run: uv run alembic upgrade head && uv run alembic check

      - name: Tests
        run: uv run pytest -q

      - name: Dependency audit
        run: |
          uv export --frozen --format requirements-txt --no-emit-project > /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt --disable-pip --require-hashes --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Production build
        run: npm run build
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
